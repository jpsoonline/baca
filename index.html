const $=id=>document.getElementById(id),enc=new TextEncoder(),dec=new TextDecoder();
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=u=>{let s='';const a=new Uint8Array(u);for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s)};
const b64u=u=>b64(u).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return unb64(s)};
const dmy=d=>String(d).split('-').reverse().join('-');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const msg=(t,bad)=>{$('m').textContent=t;$('m').style.color=bad?'#c0392b':''};
const idb=()=>new Promise((ok,no)=>{const q=indexedDB.open('rekapos_lic',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const iget=async k=>{const d=await idb();return new Promise((ok,no)=>{const r=d.transaction('k').objectStore('k').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})};
const iput=async(k,v)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})};
async function device(){let kp=await iget('dev');if(!kp){kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},false,['deriveBits']);await iput('dev',kp)}
 return{kp,code:b64u(await crypto.subtle.exportKey('raw',kp.publicKey))}}
async function check(tok,dev){
 const p=String(tok).replace(/\s+/g,'').split('.');if(p.length!=3||p[0]!='RKP1')throw new Error('Format kode lisensi tidak dikenali.');
 let bodyB,sig;try{bodyB=unb64u(p[1]);sig=unb64u(p[2])}catch(e){throw new Error('Format kode lisensi tidak dikenali.')}
 const vk=await crypto.subtle.importKey('jwk',VK,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
 if(!await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},vk,sig,bodyB))throw new Error('Kode lisensi tidak valid.');
 const b=JSON.parse(dec.decode(bodyB));
 if(b.dp!==dev.code)throw new Error('Kode lisensi ini dibuat untuk perangkat lain.');
 const t=today();let seen='';try{seen=localStorage.getItem('rkp_seen')||''}catch(e){}
 if(b.e){if(seen&&t<seen)throw new Error('Tanggal komputer lebih awal dari pemakaian sebelumnya. Perbaiki tanggal komputer.');
  if(t>b.e)throw new Error('Lisensi sudah berakhir pada '+dmy(b.e)+'.')}
 const eph=await crypto.subtle.importKey('raw',unb64u(b.eph),{name:'ECDH',namedCurve:'P-256'},false,[]);
 const bits=await crypto.subtle.deriveBits({name:'ECDH',public:eph},dev.kp.privateKey,256);
 const wk=await crypto.subtle.importKey('raw',await crypto.subtle.digest('SHA-256',bits),'AES-GCM',false,['decrypt']);
 const K=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64u(b.iv)},wk,unb64u(b.ct));
 const ak=await crypto.subtle.importKey('raw',K,'AES-GCM',false,['decrypt']);
 const html=dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(IV)},ak,unb64(PL)));
 try{if(!seen||t>seen)localStorage.setItem('rkp_seen',t)}catch(e){}
 return{b,html}}
function run(r){const b=r.b;document.open();document.write(r.html);document.close();
 setTimeout(()=>{try{const d=document.createElement('div');d.style.cssText='text-align:center;font:12px system-ui,Arial;color:#667085;padding:8px';d.textContent='Berlisensi: '+b.h+' · '+(b.e?'berlaku s/d '+dmy(b.e):'tanpa batas waktu');document.body.appendChild(d)}catch(e){}
  try{if(!b.e)return;const T=today().split('-').map(Number),E=b.e.split('-').map(Number),n=Math.round((Date.UTC(E[0],E[1]-1,E[2])-Date.UTC(T[0],T[1]-1,T[2]))/864e5);if(n>30)return;
   const w=document.createElement('div'),red=n<=7;w.style.cssText='position:sticky;top:0;z-index:99999;display:flex;gap:12px;align-items:center;justify-content:center;padding:10px 14px;font:14px/1.4 system-ui,Arial;border-bottom:1px solid '+(red?'#f1a9a4':'#e6cf7a')+';background:'+(red?'#fde2e1':'#fff1b8')+';color:'+(red?'#912018':'#6b5000');
   const t=document.createElement('span');t.textContent=n<=0?'Lisensi berakhir HARI INI ('+dmy(b.e)+'). Hubungi penyedia aplikasi untuk perpanjangan.':'Lisensi akan berakhir dalam '+n+' hari ('+dmy(b.e)+'). Hubungi penyedia aplikasi untuk perpanjangan.';
   const x=document.createElement('button');x.textContent='Tutup';x.style.cssText='font:inherit;padding:2px 10px;border-radius:6px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer';x.onclick=()=>w.remove();
   w.appendChild(t);w.appendChild(x);document.body.insertBefore(w,document.body.firstChild)}catch(e){}},500)}
(async()=>{
 let dev;try{dev=await device()}catch(e){msg('Browser ini tidak mendukung penyimpanan kunci perangkat. Gunakan Chrome atau Edge versi terbaru.',1);return}
 $('dc').value=dev.code;
 $('cp').onclick=async()=>{try{await navigator.clipboard.writeText(dev.code);msg('Kode Perangkat disalin.')}catch(e){$('dc').select();msg('Salin manual: Ctrl+C.')}};
 $('go').onclick=async()=>{const t=$('lc').value;try{const r=await check(t,dev);try{localStorage.setItem('rkp_lic',t.replace(/\s+/g,''))}catch(e){}run(r)}catch(e){msg(e.message||String(e),1)}};
 let tok='';try{tok=localStorage.getItem('rkp_lic')||''}catch(e){}
 if(tok){try{run(await check(tok,dev))}catch(e){msg(e.message,1)}}
})();
